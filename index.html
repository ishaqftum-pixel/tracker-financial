<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Keuangan Personal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (XLSX) CDN untuk Export/Import Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-slate-900"><i class="fa-solid me-2 text-indigo-600"></i>Dashboard Keuangan</h1>
        <p class="text-slate-500 text-sm mt-1">Kelola pencatatan pemasukan & pengeluaran Anda dengan mudah.</p>
      </div>
      
      <!-- Excel Export/Import Actions -->
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="exportToExcel()" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm">
          <i class="fa-solid fa-file-excel"></i> Export Excel
        </button>
        <label class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm cursor-pointer">
          <i class="fa-solid fa-file-import"></i> Import Excel
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
        </label>
        <button onclick="clearAllData()" class="inline-flex items-center gap-2 bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-xl text-sm font-semibold transition-all">
          <i class="fa-solid fa-trash-can"></i> Reset Data
        </button>
      </div>
    </div>

    <!-- Metric Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- Total Saldo -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Saldo</p>
            <h3 class="text-2xl font-bold text-slate-900 mt-2" id="totalBalance">Rp 0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-wallet"></i>
          </div>
        </div>
      </div>

      <!-- Total Pemasukan -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Pemasukan</p>
            <h3 class="text-2xl font-bold text-emerald-600 mt-2" id="totalIncome">Rp 0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-arrow-down-left"></i>
          </div>
        </div>
      </div>

      <!-- Total Pengeluaran -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Pengeluaran</p>
            <h3 class="text-2xl font-bold text-rose-600 mt-2" id="totalExpense">Rp 0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-arrow-up-right"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Form & Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
      
      <!-- Form Input -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Tambah Transaksi
        </h2>
        <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipe Transaksi</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 has-[:checked]:text-emerald-700 text-sm font-medium">
                <input type="radio" name="type" value="pemasukan" class="hidden" checked onchange="updateCategoryOptions()">
                <i class="fa-solid fa-circle-arrow-down text-emerald-500"></i> Pemasukan
              </label>
              <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50 has-[:checked]:text-rose-700 text-sm font-medium">
                <input type="radio" name="type" value="pengeluaran" class="hidden" onchange="updateCategoryOptions()">
                <i class="fa-solid fa-circle-arrow-up text-rose-500"></i> Pengeluaran
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Deskripsi / Judul</label>
            <input type="text" id="descInput" required placeholder="Contoh: Gaji Bulanan / Bensin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jumlah (Rp)</label>
            <input type="number" id="amountInput" min="1" required placeholder="100000" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
            <select id="categorySelect" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal</label>
            <input type="date" id="dateInput" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md shadow-indigo-100">
            Simpan Transaksi
          </button>
        </form>
      </div>

      <!-- Visualisasi Chart -->
      <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col items-center justify-center">
          <h3 class="text-sm font-bold text-slate-700 mb-4 w-full">Pengeluaran Berdasarkan Kategori</h3>
          <div class="w-full max-w-[240px]">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col justify-center">
          <h3 class="text-sm font-bold text-slate-700 mb-4">Perbandingan Arus Kas</h3>
          <div class="w-full h-[220px]">
            <canvas id="summaryChart"></canvas>
          </div>
        </div>
      </div>

    </div>

    <!-- Table Transactions -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="text-lg font-bold text-slate-900">Riwayat Transaksi</h2>
        <div class="flex items-center gap-2">
          <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari transaksi..." class="px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs">
            <tr>
              <th class="px-6 py-3.5">Tanggal</th>
              <th class="px-6 py-3.5">Deskripsi</th>
              <th class="px-6 py-3.5">Kategori</th>
              <th class="px-6 py-3.5">Tipe</th>
              <th class="px-6 py-3.5 text-right">Jumlah</th>
              <th class="px-6 py-3.5 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody" class="divide-y divide-slate-100">
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const categories = {
      pemasukan: ['Gaji', 'Bonus', 'Investasi', 'Usaha', 'Lainnya'],
      pengeluaran: ['Makanan & Minuman', 'Transportasi', 'Belanja', 'Tagihan & Utilitas', 'Hiburan', 'Kesehatan', 'Lainnya']
    };

    let transactions = JSON.parse(localStorage.getItem('my_financial_data')) || [];
    let categoryChartInstance = null;
    let summaryChartInstance = null;

    document.getElementById('dateInput').valueAsDate = new Date();

    function updateCategoryOptions() {
      const type = document.querySelector('input[name="type"]:checked').value;
      const select = document.getElementById('categorySelect');
      select.innerHTML = '';
      categories[type].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    function saveAndRefresh() {
      localStorage.setItem('my_financial_data', JSON.stringify(transactions));
      updateMetrics();
      renderTable();
      renderCharts();
    }

    function addTransaction(e) {
      e.preventDefault();
      const type = document.querySelector('input[name="type"]:checked').value;
      const desc = document.getElementById('descInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);
      const category = document.getElementById('categorySelect').value;
      const date = document.getElementById('dateInput').value;

      transactions.unshift({
        id: Date.now(),
        type,
        desc,
        amount,
        category,
        date
      });

      document.getElementById('descInput').value = '';
      document.getElementById('amountInput').value = '';
      saveAndRefresh();
    }

    function deleteTransaction(id) {
      if (confirm('Hapus transaksi ini?')) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRefresh();
      }
    }

    function clearAllData() {
      if (confirm('Apakah Anda yakin ingin menghapus SEMUA data? Data tidak dapat dikembalikan!')) {
        transactions = [];
        saveAndRefresh();
      }
    }

    function formatRp(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function updateMetrics() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'pemasukan') income += t.amount;
        else expense += t.amount;
      });

      document.getElementById('totalIncome').textContent = formatRp(income);
      document.getElementById('totalExpense').textContent = formatRp(expense);
      document.getElementById('totalBalance').textContent = formatRp(income - expense);
    }

    function renderTable() {
      const tbody = document.getElementById('transactionTableBody');
      const query = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = transactions.filter(t => 
        t.desc.toLowerCase().includes(query) || 
        t.category.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">Belum ada transaksi recorded.</td></tr>`;
        return;
      }

      filtered.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/50 transition-all";
        tr.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-500">${t.date}</td>
          <td class="px-6 py-4 font-medium text-slate-800">${t.desc}</td>
          <td class="px-6 py-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-semibold">${t.category}</span></td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ${t.type === 'pemasukan' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
              <i class="fa-solid ${t.type === 'pemasukan' ? 'fa-arrow-down' : 'fa-arrow-up'} text-[10px]"></i>
              ${t.type === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran'}
            </span>
          </td>
          <td class="px-6 py-4 text-right font-semibold ${t.type === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">
            ${t.type === 'pemasukan' ? '+' : '-'} ${formatRp(t.amount)}
          </td>
          <td class="px-6 py-4 text-center">
            <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 transition-all p-1"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderCharts() {
      // Category Chart
      const categoryTotals = {};
      transactions.filter(t => t.type === 'pengeluaran').forEach(t => {
        categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
      });

      const catLabels = Object.keys(categoryTotals);
      const catData = Object.values(categoryTotals);

      if (categoryChartInstance) categoryChartInstance.destroy();

      const ctxCat = document.getElementById('categoryChart').getContext('2d');
      categoryChartInstance = new Chart(ctxCat, {
        type: 'doughnut',
        data: {
          labels: catLabels.length ? catLabels : ['Belum ada data'],
          datasets: [{
            data: catData.length ? catData : [1],
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b']
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
      });

      // Summary Chart
      let incTotal = transactions.filter(t => t.type === 'pemasukan').reduce((acc, curr) => acc + curr.amount, 0);
      let expTotal = transactions.filter(t => t.type === 'pengeluaran').reduce((acc, curr) => acc + curr.amount, 0);

      if (summaryChartInstance) summaryChartInstance.destroy();

      const ctxSum = document.getElementById('summaryChart').getContext('2d');
      summaryChartInstance = new Chart(ctxSum, {
        type: 'bar',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [incTotal, expTotal],
            backgroundColor: ['#10b981', '#ef4444'],
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // --- FITUR EXPORT DAN IMPORT EXCEL ---
    function exportToExcel() {
      if (transactions.length === 0) {
        alert('Tidak ada data transaksi untuk di-export!');
        return;
      }

      // Format data untuk sheet
      const excelData = transactions.map(t => ({
        Tanggal: t.date,
        Tipe: t.type === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran',
        Deskripsi: t.desc,
        Kategori: t.category,
        Jumlah: t.amount
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Keuangan");

      // Auto-fit column widths
      worksheet['!cols'] = [
        { wch: 12 },
        { wch: 14 },
        { wch: 30 },
        { wch: 20 },
        { wch: 15 }
      ];

      XLSX.writeFile(workbook, `Laporan_Keuangan_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function importFromExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          if (jsonData.length === 0) {
            alert('File Excel kosong!');
            return;
          }

          let addedCount = 0;
          jsonData.forEach((row, index) => {
            const typeRaw = (row.Tipe || row.tipe || '').toString().toLowerCase();
            const type = typeRaw.includes('masuk') ? 'pemasukan' : 'pengeluaran';
            const desc = row.Deskripsi || row.deskripsi || 'Import Excel';
            const category = row.Kategori || row.kategori || 'Lainnya';
            const amount = parseFloat(row.Jumlah || row.jumlah || 0);
            let date = row.Tanggal || row.tanggal || new Date().toISOString().slice(0,10);

            if (amount > 0) {
              transactions.unshift({
                id: Date.now() + index,
                type,
                desc,
                amount,
                category,
                date: String(date)
              });
              addedCount++;
            }
          });

          saveAndRefresh();
          alert(`Berhasil mengimpor ${addedCount} data dari Excel!`);
        } catch (err) {
          alert('Gagal membaca file Excel. Pastikan format kolom sesuai: Tanggal, Tipe, Deskripsi, Kategori, Jumlah');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = ''; // Reset input file
    }

    // Init App
    updateCategoryOptions();
    saveAndRefresh();
  </script>
</body>
</html>
